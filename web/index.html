<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16191d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ETS2 Map">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <title>ETS2 Map</title>
</head>
<body class="theme-dark">
  <canvas id="map"></canvas>
  <canvas id="overlay"></canvas>

  <!-- Job / navigation card -->
  <div id="topleft">
  <section id="job" class="card hidden" aria-live="polite">
    <div class="job-line1"><span id="job-who" class="who-chip hidden"></span><span id="job-title">—</span></div>
    <div class="job-line2" id="job-sub"></div>
    <div class="job-stats">
      <div><span class="k">Distance</span><span id="nav-dist" class="v">—</span></div>
      <div><span class="k">Trajet</span><span id="nav-time" class="v">—</span><span id="nav-time-real" class="r"></span></div>
      <div><span class="k">Arrivée</span><span id="nav-eta" class="v">—</span><span id="nav-eta-real" class="r"></span></div>
      <div id="deadline-box"><span class="k">Délai</span><span id="deadline" class="v">—</span><span id="deadline-real" class="r"></span></div>
    </div>
  </section>

  <!-- Next directions -->
  <section id="turn" class="card hidden" aria-live="off">
    <svg id="turn-icon" class="turn-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
    <div class="turn-main"><span id="turn-dist">—</span><span id="turn-text"></span></div>
    <div id="turn-then" class="turn-then"><span class="k">Puis</span><svg id="turn-then-icon" class="turn-icon" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="turn-then-dist"></span></div>
  </section>
  </div>

  <!-- Status banner -->
  <div id="banner" class="banner">Connexion…</div>

  <!-- Speed cluster -->
  <section id="speed" class="card">
    <div class="speed-main"><span id="speed-val">0</span><span class="unit">km/h</span></div>
    <div class="speed-side">
      <div id="limit" class="limit hidden"><span id="limit-val">90</span></div>
      <div id="cruise" class="cruise hidden">CC <span id="cruise-val">0</span></div>
      <div id="gear" class="gear">N</div>
    </div>
  </section>

  <!-- Bottom info strip -->
  <section id="info" class="card">
    <div class="info-item" title="Carburant">
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 3h8a1 1 0 0 1 1 1v7h1a2 2 0 0 1 2 2v4a1 1 0 0 0 2 0V9.4l-2.7-2.7 1.4-1.4L21 7.6V17a3 3 0 0 1-6 0v-4h-1v7H4V4a1 1 0 0 1 1-1zm1 2v5h6V5H6z"/></svg>
      <div class="fuel-wrap"><div id="fuel-bar" class="fuel-bar"></div></div>
      <span id="fuel-val">—</span>
    </div>
    <div class="info-item" title="Prochaine pause (jeu / réel)">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-1 3v6.2l5 3 1-1.7-4-2.4V7z"/></svg>
      <span class="tv"><span id="rest-val">—</span><small id="rest-real"></small></span>
    </div>
    <div class="info-item" title="Heure du jeu / heure réelle">
      <svg viewBox="0 0 24 24" class="ico"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2zm12 8H5v9h14v-9z"/></svg>
      <span class="tv"><span id="clock-val">—</span><small id="clock-real"></small></span>
    </div>
  </section>

  <!-- Map controls -->
  <nav id="controls">
    <button id="btn-zoom-in" class="btn" aria-label="Zoom avant">+</button>
    <button id="btn-zoom-out" class="btn" aria-label="Zoom arrière">−</button>
    <button id="btn-rotate" class="btn" aria-label="Orientation">
      <svg viewBox="0 0 24 24" id="compass"><path d="M12 2l4 10h-8z" class="n"/><path d="M12 22l-4-10h8z" class="s"/></svg>
    </button>
    <button id="btn-3d" class="btn txt" aria-label="Vue 3D">3D</button>
    <button id="btn-fit" class="btn" aria-label="Vue d'ensemble">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
    </button>
    <button id="btn-convoy" class="btn" aria-label="Convoi">
      <svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7.5 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM9 13c-3.3 0-7 1.7-7 4v3h14v-3c0-2.3-3.7-4-7-4zm7.5 0c-.6 0-1.3.1-2 .2 1.5 1 2.5 2.3 2.5 3.8v3h5v-3c0-2.2-2.9-4-5.5-4z"/></svg>
      <span id="convoy-badge" class="badge hidden">0</span>
    </button>
    <button id="btn-menu" class="btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
    </button>
  </nav>
  <button id="btn-recenter" class="pill hidden">
    <svg viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z"/></svg> <span>Recentrer</span>
  </button>

  <!-- Settings sheet -->
  <dialog id="settings">
    <form method="dialog">
      <h2>Réglages</h2>
      <div class="opts">
      <label><input type="checkbox" id="set-route" checked> Itinéraire en rouge</label>
      <label><input type="checkbox" id="set-peer-routes" checked> Itinéraires des potes (pointillés)</label>
      <label><input type="checkbox" id="set-night" checked> Thème nuit</label>
      <label><input type="checkbox" id="set-pois" checked> Stations, parkings, garages…</label>
      <label><input type="checkbox" id="set-companies" checked> Logos des entreprises</label>
      <label><input type="checkbox" id="set-shields" checked> Numéros de routes</label>
      <label><input type="checkbox" id="set-turns" checked> Prochaines directions</label>
      <label><input type="checkbox" id="set-trail" checked> Trace parcourue</label>
      <label><input type="checkbox" id="set-3d"> Vue 3D inclinée (comme un GPS)</label>
      <label><input type="checkbox" id="set-autozoom" checked> Zoom selon la vitesse</label>
      <label><input type="checkbox" id="set-awake" checked> Garder l'écran allumé</label>
      </div>
      <div class="row">
        <button type="button" id="btn-fullscreen">Plein écran</button>
        <button type="button" id="btn-clear-trail">Effacer la trace</button>
      </div>
      <div class="row">
        <button type="button" id="btn-clear-dest">Effacer la destination choisie</button>
      </div>
      <div class="row"><a class="download" href="https://github.com/bigohi/ETS2-Map/releases/latest" target="_blank" rel="noopener">Télécharger ETS2 Map pour PC</a></div>
      <p class="about">Appui long sur la carte : itinéraire vers ce point.</p>
      <p class="about" id="about"></p>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>

  <!-- Convoy sheet -->
  <dialog id="convoy-sheet">
    <form method="dialog">
      <h2>Convoi</h2>
      <div class="convoy-grid">
      <div class="convoy-form">
      <div class="field"><span>Ton pseudo</span><input id="convoy-name" maxlength="24" autocomplete="off" placeholder="Quentin"></div>
      <div class="field"><span>Code du convoi</span><input id="convoy-room" maxlength="64" autocomplete="off" autocapitalize="none" placeholder="ex. convoi-du-samedi"></div>
      <div class="row">
        <button type="button" id="convoy-join" class="primary">Rejoindre</button>
        <button type="button" id="convoy-leave" class="hidden">Quitter</button>
      </div>
      <p class="about" id="convoy-msg"></p>
      </div>
      <ul id="convoy-list"></ul>
      </div>
      <div class="row"><a class="download" href="https://github.com/bigohi/ETS2-Map/releases/latest" target="_blank" rel="noopener">Télécharger ETS2 Map pour PC</a></div>
      <button value="close">Fermer</button>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"><span></span><button class="hidden"></button></div>

  <video id="keepawake" muted playsinline loop hidden></video>
  <script type="module" src="js/app.js"></script>
</body>
</html>
